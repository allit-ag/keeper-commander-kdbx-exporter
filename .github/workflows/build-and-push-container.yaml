name: Build and Push Docker Container

on:
  push:
    branches:
      - 'develop-*'
    tags:
      - '*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        required: false
        default: main
        description: 'Tag to build (e.g., v1.2.3)'
  schedule:
   - cron: '30 23 * * 0'

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  build-keeper-commander-kdbx-exporter:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || (github.event_name == 'schedule' && 'main') || github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TAG }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
              
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}},value=${{ env.TAG }},enable={{is_default_branch}}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }},enable={{is_default_branch}}
            type=semver,pattern={{major}},value=${{ env.TAG }},enable={{is_default_branch}}
            type=raw,value=latest,event=branch
            type=raw,value=dev,enable=${{ startsWith(github.ref_name, 'develop-') }}

      -   name: Build and push Docker images
          id: push
          uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
          with:
            file: ./Dockerfile
            push: true
            tags: ${{ steps.meta.outputs.tags }}
            labels: ${{ steps.meta.outputs.labels }}
            platforms: linux/amd64
            outputs: type=image,name=target,annotation-index.org.opencontainers.image.description=Keeper KDBX exporter/,annotation-index.org.opencontainers.image.version=${{ github.event.inputs.tag }}
