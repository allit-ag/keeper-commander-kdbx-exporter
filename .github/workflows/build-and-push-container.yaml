name: Build and Push Docker Container

on:
  push:
    branches:
      - 'main'
    paths:
      - 'Dockerfile'
      - '.github/workflows/build-and-push-container.yaml'
    tags:
      - '*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        required: false
        default: main
        description: 'Tag to build (e.g., v1.2.3)'
  schedule:
   - cron: '30 23 * * 0'

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  build-keeper-commander-kdbx-exporter:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
              
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}},value=${{ env.TAG }},enable={{is_default_branch}}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }},enable={{is_default_branch}}
            type=semver,pattern={{major}},value=${{ env.TAG }},enable={{is_default_branch}}
            type=raw,value=latest,event=branch
            type=raw,value=dev,enable=${{ startsWith(github.ref_name, 'develop-') }}

      -   name: Build and push Docker images
          id: push
          uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
          with:
            file: ./Dockerfile
            push: true
            tags: ${{ steps.meta.outputs.tags }}
            labels: ${{ steps.meta.outputs.labels }}
            platforms: linux/amd64
            outputs: type=image,name=target,annotation-index.org.opencontainers.image.description=Keeper KDBX exporter/,annotation-index.org.opencontainers.image.version=${{ github.event.inputs.tag }}
